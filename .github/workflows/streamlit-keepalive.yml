name: Keep Streamlit awake

on:
  schedule:
    # Every six hours through 20 November, then twice plus a final pre-deadline
    # visit on 21 November. Times are UTC; the deadline is 13:00 CET (12:00 UTC).
    - cron: '17 */6 16-20 11 *'
    - cron: '17 0,6 21 11 *'
    - cron: '47 11 21 11 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-keepalive
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the keep-awake deadline
        id: active_window
        env:
          DEADLINE_UTC: '2026-11-21T12:00:00Z'
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d "$DEADLINE_UTC" +%s)" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Keep-awake period ended at $DEADLINE_UTC."
          fi
      - name: Check out the assignment
        if: steps.active_window.outputs.active == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.active_window.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-keepalive.txt
      - name: Install the browser checker
        if: steps.active_window.outputs.active == 'true'
        run: |
          python -m pip install -r scripts/requirements-keepalive.txt
          python -m playwright install --with-deps chromium
      - name: Wake the app and verify the entry screen
        if: steps.active_window.outputs.active == 'true'
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://be-choice-under-risk-assignment.streamlit.app/' }}
        run: python scripts/wake_streamlit.py
